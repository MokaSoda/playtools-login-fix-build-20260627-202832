name: Build PlayTools

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FASTLANE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 when available
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild \
            -project PlayTools.xcodeproj \
            -scheme PlayTools \
            -resolvePackageDependencies

      - name: Build Mac Catalyst framework
        run: |
          set -o pipefail
          DERIVED_DATA="$RUNNER_TEMP/PlayToolsDerivedData"
          xcodebuild \
            -project PlayTools.xcodeproj \
            -scheme PlayTools \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

          mkdir -p "$RUNNER_TEMP/artifact"
          find "$DERIVED_DATA/Build/Products" -maxdepth 3 \
            \( -name 'PlayTools.framework' -o -name 'AKInterface.bundle' \) \
            -print -exec cp -R {} "$RUNNER_TEMP/artifact/" \;
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/artifact/"
          (cd "$RUNNER_TEMP/artifact" && zip -qry "$RUNNER_TEMP/PlayTools-maccatalyst.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTools-maccatalyst
          path: ${{ runner.temp }}/PlayTools-maccatalyst.zip
          if-no-files-found: error
